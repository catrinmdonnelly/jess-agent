name: Jess daily Instagram

# Jess runs three times a day in your local timezone.
# Defaults: 08:30 plan, 12:00 post, 18:00 post (all UK time).
# GitHub Actions cron runs in UTC, so each slot has a BST and a GMT cron.
# Adjust if you're not on UK time.

on:
  schedule:
    # 08:30 UK plan — 07:30 UTC BST, 08:30 UTC GMT
    - cron: "30 7 * * *"
    - cron: "30 8 * * *"
    # 12:00 UK slot 1 — 11:00 UTC BST, 12:00 UTC GMT
    - cron: "0 11 * * *"
    - cron: "0 12 * * *"
    # 18:00 UK slot 2 — 17:00 UTC BST, 18:00 UTC GMT
    - cron: "0 17 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Force a specific phase. Leave blank for auto."
        required: false
        type: choice
        options: ["", "plan", "publish_slot_1", "publish_slot_2"]
        default: ""

concurrency:
  group: jess-agent
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-opus-4-6' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AGENT_TIMEZONE: ${{ vars.AGENT_TIMEZONE || 'Europe/London' }}
      BUSINESS_NAME: ${{ vars.BUSINESS_NAME || 'your business' }}
      INSTAGRAM_HANDLE: ${{ vars.INSTAGRAM_HANDLE || '' }}
      BRAND_BG_COLOR: ${{ vars.BRAND_BG_COLOR || '#1a2332' }}
      BRAND_TEXT_COLOR: ${{ vars.BRAND_TEXT_COLOR || '#f5efe6' }}
      BRAND_ACCENT_COLOR: ${{ vars.BRAND_ACCENT_COLOR || '#eba18a' }}
      FONT_REGULAR_URL: ${{ vars.FONT_REGULAR_URL }}
      FONT_ITALIC_URL: ${{ vars.FONT_ITALIC_URL }}
      JESS_PLAN_HOUR: ${{ vars.JESS_PLAN_HOUR || '8' }}
      JESS_SLOT1_HOUR: ${{ vars.JESS_SLOT1_HOUR || '12' }}
      JESS_SLOT2_HOUR: ${{ vars.JESS_SLOT2_HOUR || '18' }}
      JESS_MODE: ${{ inputs.mode }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
      META_INSTAGRAM_ACCOUNT_ID: ${{ secrets.META_INSTAGRAM_ACCOUNT_ID }}
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
      WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_PASSWORD: ${{ secrets.WP_PASSWORD }}
      FAILURE_EMAIL_TO: ${{ secrets.FAILURE_EMAIL_TO }}
      FAILURE_EMAIL_FROM: ${{ secrets.FAILURE_EMAIL_FROM }}
      FAILURE_EMAIL_SMTP_HOST: ${{ secrets.FAILURE_EMAIL_SMTP_HOST }}
      FAILURE_EMAIL_SMTP_PASS: ${{ secrets.FAILURE_EMAIL_SMTP_PASS }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Jess
        run: python jess.py

      - name: Rotate old artefacts
        if: always()
        run: |
          find logs -type f -mtime +90 -delete 2>/dev/null || true
          find reports -type f -name '*.json' -mtime +30 -delete 2>/dev/null || true
          find images -type f -mtime +14 -delete 2>/dev/null || true

      - name: Commit artefacts
        if: always()
        run: |
          git config user.name "jess-agent-bot"
          git config user.email "jess-agent-bot@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add --all -- plans images logs reports || true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "jess: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
